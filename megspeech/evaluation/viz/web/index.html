<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>megspeech viz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>megspeech · viz</h1>
    <div id="models" class="models"></div>
    <p class="sub status" id="status"></p>
  </header>

  <main>
    <section class="panel left">
      <h2>samples <span class="mut" id="count"></span></h2>
      <div class="searchrow">
        <input id="q" type="search" placeholder="search id / label / text" />
        <button id="filterbtn" class="filterbtn">filters</button>
      </div>
      <dialog id="filterbox" class="filterbox">
        <h2>filters</h2>
        <div class="controls" id="filters"></div>
        <div class="dlgfoot"><button id="filterreset">reset</button><button id="filterdone">done</button></div>
      </dialog>
      <div id="list" class="list"></div>
    </section>

    <section class="panel mid" id="mid">
      <div class="textbox">
        <p id="sentence" class="sentence"></p>
        <div id="preds" class="preds"></div>
        <p id="meta" class="hint"></p>
      </div>
      <div class="trackhead">
        <button id="megtoggle" class="fold" aria-expanded="true"><span class="caret">▾</span> MEG <span class="mut" id="meghead"></span></button>
        <span class="heatkey" id="heatkey" title="trace colour: the channel's model-weight percentile for this word" hidden><span class="glabel">weight</span><i></i></span>
        <label class="nch" id="nchbox"><span class="glabel">channels</span>
          <select id="chsel" title="which channels to draw"></select>
          <input id="nch" type="range" min="1" max="64" value="24" />
          <span id="nchlabel" class="tlabel"></span></label>
      </div>
      <div id="megbox" class="megbox"><canvas id="meg" class="meg"></canvas></div>
      <div class="trackhead">
        <h2>audio <span class="mut" id="audhead"></span></h2>
        <span id="tlabel" class="tlabel"></span>
      </div>
      <canvas id="wave" class="wave"></canvas>
      <audio id="player" controls preload="auto"></audio>
    </section>

    <section class="panel right">
      <h2>ranking</h2>
      <div id="topk" class="topk"></div>
      <div class="trackhead">
        <h2>embedding <span class="mut" id="embhead"></span> <span class="help" id="schint" tabindex="0">?</span></h2>
        <select id="projsel" class="mselect pick projsel" title="2-D projection of the embedding"></select>
        <select id="colorby" class="mselect pick" title="colour points by">
          <option value="class">class</option><option value="label">label</option><option value="word">word</option><option value="source">source</option><option value="position">position</option><option value="error">error</option>
        </select>
      </div>
      <div class="scatter-box"><canvas id="scatter"></canvas><div id="tip" class="tip" hidden></div></div>
      <div id="legend" class="legend"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
